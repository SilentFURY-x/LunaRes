services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lunares}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-lunares}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lunares}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Redis (job queue broker + result backend) ─────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ──────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── MinIO bucket initialization ───────────────────────────────────
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-lunares-scenes};
      echo 'Bucket ready';
      exit 0;
      "

  # ── Dynamic COG tile server ──────────────────────────────────────
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports:
      - "8001:8000"
    environment:
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - AWS_VIRTUAL_HOSTING=false
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI backend ──────────────────────────────────────────────
  api:
    image: lunares-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lunares}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lunares}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-lunares-scenes}
      - S3_REGION=${S3_REGION:-us-east-1}
      - TITILER_URL=http://titiler:8000
      - BHOONIDHI_ADAPTER_MODE=${BHOONIDHI_ADAPTER_MODE:-mock}
      - MODEL_VERSION=${MODEL_VERSION:-lunares-sr-v0.1.0}
      - SR_MODEL_WEIGHTS_PATH=${SR_MODEL_WEIGHTS_PATH:-/app/weights/sr_fast_v1.pt}
      - CORS_ORIGINS=["*"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../models:/models:ro
    restart: unless-stopped

  # ── Celery worker (inference pipeline) ───────────────────────────
  worker:
    image: lunares-backend:latest
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lunares}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lunares}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-lunares-scenes}
      - S3_REGION=${S3_REGION:-us-east-1}
      - BHOONIDHI_ADAPTER_MODE=${BHOONIDHI_ADAPTER_MODE:-mock}
      - MODEL_VERSION=${MODEL_VERSION:-lunares-sr-v0.1.0}
      - SR_MODEL_WEIGHTS_PATH=${SR_MODEL_WEIGHTS_PATH:-/app/weights/sr_fast_v1.pt}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../models:/models:ro
    restart: unless-stopped

  # ── Frontend (React + Vite) ──────────────────────────────────────
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_TILE_SERVER_URL=http://localhost:8001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
